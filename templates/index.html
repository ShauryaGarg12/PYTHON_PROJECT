<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exam Scheduler</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f9f9f9; color: #333; }
  .card { background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; }
  .grid { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  input { padding: 6px; border: 1px solid #ccc; border-radius: 3px; }
  button { padding: 8px 12px; cursor: pointer; background: #007bff; color: #fff; border: none; border-radius: 3px; }
  button:hover { background: #0056b3; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: left; font-size: 14px; }
  th { background: #eee; }
  .tag { background: #007bff; color: white; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-weight: bold; }
  .hidden { display: none; }
  .warn-box { background: #fffbf0; border: 1px solid #e6c55a; border-left: 4px solid #d4a017; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>

<h2>🎓 Exam Scheduler</h2>

<div id="input-section">
  <div class="card">
    <h3>1. Rooms</h3>
    <label>Total Rooms:</label>
    <input type="number" id="total_rooms" value="4" min="1" onchange="setupRooms()"/>
    <p style="margin-top:10px;">Benches per Room:</p>
    <div id="rooms-container" class="grid"></div>
  </div>

  <div class="card">
    <h3>2. Departments</h3>
    <div id="dept-container"></div>
    <button onclick="addDept()">+ Add Department</button>
  </div>

  <button onclick="generate()">Generate Schedule</button>
  <p id="err" style="color:red;"></p>
</div>

<div id="results" class="hidden">
  <div class="card">
    <h3>Schedule Generated</h3>
    <p><a href="/download-file">📥 Download File (.txt)</a></p>

    <div id="warn-box" class="warn-box hidden">
      <strong>⚠️ Warnings & Notes:</strong>
      <ul id="warn-list" style="margin-left: 20px; margin-top: 5px;"></ul>
    </div>
    
    <h4>Exam Schedule</h4>
    <table>
      <thead><tr><th>Dept</th><th>Exam</th><th>Day</th><th>Shift</th><th>Rooms</th><th>Placed</th></tr></thead>
      <tbody id="sched-body"></tbody>
    </table>

    <h4 style="margin-top:20px;">Seating Plan</h4>
    <div id="room-plan"></div>

    <br/>
    <button onclick="location.reload()">← Back</button>
  </div>
</div>

<script>
function setupRooms() {
  const container = document.getElementById('rooms-container');
  const count = +document.getElementById('total_rooms').value || 1;
  container.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    container.innerHTML += `<div>R${i}: <input type="number" class="bench-input" value="20" style="width:50px;"/></div>`;
  }
}

function addDept() {
  const div = document.createElement('div');
  div.className = 'grid';
  div.innerHTML = `
    <input type="text" class="dn" placeholder="Dept Name" style="width:100px; text-transform:uppercase"/>
    <input type="number" class="ds" placeholder="Students" style="width:90px;"/>
    <input type="number" class="de" placeholder="Exams" style="width:70px;"/>
    <button onclick="this.parentElement.remove()" style="background:red;">X</button>`;
  document.getElementById('dept-container').appendChild(div);
}

async function generate() {
  const room_benches = Array.from(document.querySelectorAll('.bench-input')).map(i => +i.value);
  const departments = [];

  for (const div of document.querySelectorAll('#dept-container .grid')) {
    const name = div.querySelector('.dn').value.trim().toUpperCase();
    const students = +div.querySelector('.ds').value;
    const exams = +div.querySelector('.de').value;
    if (!name || !students || !exams) {
      document.getElementById('err').textContent = 'Please fill all fields!';
      return;
    }
    departments.push({ name, students, exams });
  }

  const res = await fetch('/schedule', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ room_benches, departments })
  });
  
  const data = await res.json();
  if (data.error) {
    document.getElementById('err').textContent = data.error;
    return;
  }

  render(data);
}

function render(data) {
  document.getElementById('input-section').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');

  const warnBox = document.getElementById('warn-box');
  const warnList = document.getElementById('warn-list');
  if (data.warnings && data.warnings.length > 0) {
    warnBox.classList.remove('hidden');
    warnList.innerHTML = data.warnings.map(w => `<li>${w}</li>`).join('');
  } else {
    warnBox.classList.add('hidden');
  }

  document.getElementById('sched-body').innerHTML = data.schedule.map(r => `
    <tr>
      <td><span class="tag">${r.dept}</span></td>
      <td>Exam ${r.exam_num}</td><td>Day ${r.day}</td><td>${r.shift}</td>
      <td>${r.rooms.map(rm => `Room ${rm.room_id}`).join(', ')}</td>
      <td>${r.placed}/${r.total}</td>
    </tr>`).join('');

  document.getElementById('room-plan').innerHTML = data.room_plan.map(slot => `
    <div style="margin-top:10px;">
      <strong>Day ${slot.day} - ${slot.shift}</strong>
      ${slot.rooms.map(rm => `
        <table>
          <tr><th colspan="3">Room ${rm.room_id}</th></tr>${rm.bench_grid.map(b => `
            <tr>
              <td>Bench ${b.bench}</td>
              <td>${b.pos_a_dept ? b.pos_a_dept + ' (' + b.pos_a_label + ')' : 'Empty'}</td>
              <td>${b.pos_b_dept ? b.pos_b_dept + ' (' + b.pos_b_label + ')' : 'Empty'}</td>
            </tr>`).join('')}
        </table>`).join('')}
    </div>`).join('');
}

setupRooms();
addDept();
addDept();
</script>
</body>
</html>
